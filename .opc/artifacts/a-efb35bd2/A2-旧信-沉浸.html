<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>念念 · 陈列室 — A2「旧信 · 沉浸」满屏可交互样板</title>
<style>
/* ============================================================
   念念陈列室 · A2「旧信 · 沉浸」——满屏沉浸外壳 · 可交互样板
   DNA 血统不变（Almanac 暖奶油 · 陶土红 · 高对比衬线），
   本样板新增三样规范：浮层玻璃、Canva 式手柄、满屏场景自适应层。
   ============================================================ */
:root{
  /* —— 老 DNA tokens（与 tokens.css 逐一对齐，未改动）—— */
  --color-sand:#e7dcc7; --color-paper:#f4ecdd; --color-card:#fbf6ec;
  --color-ink:#2c2620; --color-ink-soft:#6b6152; --color-line:#d9cdb6;
  --color-accent:#a8572f; --color-accent-soft:#c98a5b; --color-accent-tint:#fbeee2;
  --color-popup:rgba(250,244,232,.87); --color-popup-line:rgba(168,87,47,.42);
  --font-serif:Georgia,"Songti SC","Times New Roman",serif;
  --font-sans:system-ui,-apple-system,"PingFang SC","Helvetica Neue",sans-serif;
  --text-brand:19px; --text-title:22px; --text-body:14.5px;
  --text-label:11px; --text-kicker:10.5px; --text-meta:11.5px;
  --radius-sm:6px; --radius-md:10px; --radius-lg:14px; --radius-pill:999px;
  --rule:1px; --dur-fast:.18s; --ease-out:cubic-bezier(.22,.61,.36,1);
  --shadow-card:0 6px 16px -8px rgba(60,40,20,.40);
  --shadow-float:0 22px 48px -16px rgba(60,40,20,.60);
  --shadow-item:drop-shadow(0 10px 14px rgba(0,0,0,.42));

  /* —— v2 新增 · 浮层玻璃（沉浸外壳的统一材质）—— */
  --glass-bg:rgba(250,244,232,.78);
  --glass-bg-soft:rgba(250,244,232,.58);
  --glass-line:rgba(226,213,190,.75);
  --glass-blur:16px;
  --shadow-glass:0 10px 34px -14px rgba(40,25,10,.5);

  /* —— v2 新增 · 手柄（Canva 式）—— */
  --h2-size:13px;                 /* 角手柄圆点直径 */
  --h2-bg:#ffffff;
  --h2-line:rgba(62,46,30,.32);
  --h2-shadow:0 1px 5px rgba(20,12,4,.38);
  --sel-line:rgba(168,87,47,.95); /* 选框描边 · 陶土红 */
  --h2-hit:26px;                  /* 触摸命中区 */
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; overflow:hidden; background:var(--color-sand);
  font-family:var(--font-sans); font-size:var(--text-body); color:var(--color-ink);
  -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none;
}

/* ============ 场景自适应层：任意比例 contain 居中 + 同图模糊补边 ============ */
#stage{position:fixed; inset:0; overflow:hidden}
.scene-blur{
  position:absolute; inset:-4%; z-index:0;
  background-size:cover; background-position:center;
  filter:blur(30px) saturate(1.08) brightness(.9);
  transform:scale(1.06);
}
.scene-img{
  position:absolute; z-index:1; display:block;
  box-shadow:0 0 60px rgba(20,12,4,.35);
}
#stage::after{ /* 暗角，沿用画布 inset 气质 */
  content:''; position:absolute; inset:0; z-index:2; pointer-events:none;
  box-shadow:inset 0 0 120px rgba(40,25,10,.30);
}
#items{position:absolute; inset:0; z-index:3}

/* ============ 摆放的物件 + Canva 式选中态 ============ */
.item{position:absolute; transform-origin:center; touch-action:none; cursor:grab}
.item:active{cursor:grabbing}
body[data-mode=guest] .item{cursor:pointer}
.item>img{display:block; width:100%; height:auto; pointer-events:none; filter:var(--shadow-item)}
.item .sel-ui{display:none}
.item.is-sel .sel-ui{display:block}
.item.is-sel .rot{display:flex}
.frame{
  position:absolute; inset:-3px; border:1.5px solid var(--sel-line);
  border-radius:3px; pointer-events:none;
  box-shadow:0 0 0 1px rgba(255,255,255,.35), 0 2px 10px rgba(20,12,4,.22);
}
.h{
  position:absolute; width:var(--h2-size); height:var(--h2-size);
  background:var(--h2-bg); border:1px solid var(--h2-line); border-radius:50%;
  box-shadow:var(--h2-shadow); touch-action:none; z-index:2;
}
.h::after{ /* 触摸命中区（不改视觉） */
  content:''; position:absolute; left:50%; top:50%;
  width:var(--h2-hit); height:var(--h2-hit); transform:translate(-50%,-50%);
}
.h.tl{left:0;top:0;transform:translate(-50%,-50%);cursor:nwse-resize}
.h.tr{right:0;top:0;transform:translate(50%,-50%);cursor:nesw-resize}
.h.bl{left:0;bottom:0;transform:translate(-50%,50%);cursor:nesw-resize}
.h.br{right:0;bottom:0;transform:translate(50%,50%);cursor:nwse-resize}
.rot{
  position:absolute; left:50%; bottom:-38px; transform:translateX(-50%);
  width:26px; height:26px; border-radius:50%;
  background:var(--h2-bg); border:1px solid var(--h2-line); box-shadow:var(--h2-shadow);
  display:flex; align-items:center; justify-content:center;
  color:#5c5244; cursor:grab; touch-action:none; padding:0; z-index:2;
}
.rot:hover{color:var(--color-accent)}
.rot svg{width:14px;height:14px}

/* 选中物件上方的浮动小工具条 */
#toolbar{
  position:absolute; z-index:5; display:none; align-items:center; gap:2px;
  padding:4px; border-radius:var(--radius-pill);
  background:var(--glass-bg); border:var(--rule) solid var(--glass-line);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.05);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.05);
  box-shadow:var(--shadow-glass);
  transform:translate(-50%,-100%);
  transition:opacity var(--dur-fast) var(--ease-out);
}
#toolbar.show{display:flex}
#toolbar button{
  width:32px; height:32px; border:0; border-radius:50%; background:transparent;
  color:#5c5244; display:flex; align-items:center; justify-content:center; cursor:pointer;
  transition:background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
#toolbar button:hover{background:var(--color-accent-tint); color:var(--color-accent)}
#toolbar .tb-div{width:1px; height:18px; background:var(--glass-line)}
#toolbar svg{width:15px;height:15px}

/* ============ 浮层外壳（玻璃材质，拖动时整体让路） ============ */
.chrome{
  position:absolute; z-index:10;
  transition:opacity .22s var(--ease-out);
}
body.dragging .chrome{opacity:.05; pointer-events:none}
body.dragging #toolbar, body.gesturing #toolbar{opacity:0}
body.ui-hidden .chrome:not(.eye-keeper){opacity:0; pointer-events:none}
body.ui-hidden .eye-keeper{opacity:.4}
.glass{
  background:var(--glass-bg); border:var(--rule) solid var(--glass-line);
  backdrop-filter:blur(var(--glass-blur)) saturate(1.05);
  -webkit-backdrop-filter:blur(var(--glass-blur)) saturate(1.05);
  box-shadow:var(--shadow-glass);
}

/* 报头（左上）：品牌章 */
.brand{
  left:18px; top:16px; padding:9px 16px 8px; border-radius:var(--radius-lg);
}
.brand h1{margin:0; font-family:var(--font-serif); font-weight:400; font-size:var(--text-brand); letter-spacing:.5px}
.brand small{display:block; font-size:9px; letter-spacing:3px; color:var(--color-ink-soft); text-transform:uppercase; margin-top:1px}

/* 右上：模式开关 + 隐藏界面 */
.ctl{right:18px; top:16px; display:flex; gap:10px; align-items:center}
.seg{
  display:flex; padding:3px; border-radius:var(--radius-pill);
}
.seg button{
  border:0; background:transparent; color:var(--color-ink-soft);
  font-family:var(--font-sans); font-size:12.5px; padding:6px 15px;
  border-radius:var(--radius-pill); cursor:pointer;
  transition:background var(--dur-fast) var(--ease-out), color var(--dur-fast) var(--ease-out);
}
.seg button.on{background:var(--color-accent); color:var(--color-card)}
.eye{
  width:36px; height:36px; border-radius:50%; border:var(--rule) solid var(--glass-line);
  display:flex; align-items:center; justify-content:center; cursor:pointer;
  color:#5c5244; padding:0;
}
.eye:hover{color:var(--color-accent)}
.eye svg{width:16px;height:16px}

/* 场景条（底部居中） */
.scenes{
  left:50%; bottom:16px; transform:translateX(-50%);
  display:flex; gap:8px; align-items:center; padding:7px 10px;
  border-radius:var(--radius-pill); max-width:calc(100vw - 32px);
}
.scenes .lbl{font-size:9.5px; letter-spacing:2px; text-transform:uppercase; color:var(--color-ink-soft); margin:0 4px 0 6px}
.chip{
  font-family:var(--font-serif); font-size:13px; padding:6px 15px;
  border:var(--rule) solid transparent; border-radius:var(--radius-pill);
  background:transparent; color:var(--color-ink-soft); cursor:pointer;
  transition:all var(--dur-fast) var(--ease-out); white-space:nowrap;
}
.chip:hover{color:var(--color-ink)}
.chip.on{border-color:var(--color-accent); color:var(--color-accent); background:var(--color-accent-tint)}
.chip.add{border:1px dashed var(--color-line); color:#b3a78e; cursor:not-allowed; font-family:var(--font-sans); font-size:12px}

/* 物件库 dock（左侧，可收合） */
.dock{
  left:18px; top:50%; transform:translateY(-50%);
  display:flex; align-items:stretch; border-radius:var(--radius-lg); overflow:hidden;
}
.dock-panel{width:104px; max-height:calc(100vh - 132px); display:flex; flex-direction:column}
.dock.closed .dock-panel{display:none}
.dock-head{
  padding:10px 12px 7px; font-size:9.5px; letter-spacing:2px; text-transform:uppercase;
  color:var(--color-ink-soft); border-bottom:var(--rule) solid var(--glass-line);
}
.dock-list{overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:9px}
.dock-list::-webkit-scrollbar{width:0}
.thumb{
  background:var(--color-card); border:var(--rule) solid var(--color-line);
  border-radius:var(--radius-sm); padding:8px 6px 6px; text-align:center;
  cursor:grab; touch-action:none;
  transition:transform var(--dur-fast) var(--ease-out), box-shadow var(--dur-fast) var(--ease-out);
}
.thumb:hover{transform:translateY(-2px); box-shadow:var(--shadow-card)}
.thumb img{display:block; width:100%; height:48px; object-fit:contain; pointer-events:none}
.thumb span{display:block; font-family:var(--font-serif); font-size:11px; margin-top:4px; color:var(--color-ink-soft)}
.dock-tab{
  width:30px; border:0; background:transparent; cursor:pointer; color:#5c5244;
  display:flex; align-items:center; justify-content:center; padding:0;
}
.dock-tab:hover{color:var(--color-accent)}
.dock-tab svg{width:14px;height:14px; transition:transform var(--dur-fast) var(--ease-out)}
.dock.closed{border-radius:var(--radius-md)}
.dock.closed .dock-tab{width:38px; height:64px}
.dock.closed .dock-tab svg{transform:rotate(180deg)}

/* 右下角提示 */
.hint{
  right:18px; bottom:16px; padding:7px 13px; border-radius:var(--radius-pill);
  font-size:11px; color:var(--color-ink-soft); max-width:min(46vw,380px);
}
.hint b{color:var(--color-accent); font-weight:600}

/* ============ 故事弹窗（沿用半透明奶油款，适配满屏） ============ */
.story{
  position:absolute; right:24px; top:50%; transform:translateY(-50%);
  width:294px; max-width:calc(100vw - 48px); max-height:calc(100vh - 48px);
  overflow-y:auto; z-index:40; padding:20px 19px 18px;
  background:var(--color-popup); border:var(--rule) solid var(--color-popup-line);
  border-radius:var(--radius-md); box-shadow:var(--shadow-float);
  backdrop-filter:blur(12px) saturate(1.06);
  -webkit-backdrop-filter:blur(12px) saturate(1.06);
}
.story[hidden]{display:none}
.story-close{
  position:absolute; right:10px; top:10px; width:24px; height:24px;
  border:var(--rule) solid var(--color-line); border-radius:50%;
  background:rgba(255,255,255,.4); color:var(--color-ink-soft);
  font-size:11px; line-height:1; cursor:pointer;
}
.story-close:hover{border-color:var(--color-accent); color:var(--color-accent)}
.story-kicker{font-size:var(--text-kicker); letter-spacing:2px; text-transform:uppercase; color:var(--color-accent); margin-bottom:7px; padding-right:26px}
.story-name{margin:0 0 2px; font-family:var(--font-serif); font-weight:400; font-size:var(--text-title)}
.story-meta{margin:0 0 12px; font-size:var(--text-meta); color:var(--color-ink-soft)}
.story-body{margin:0; font-family:var(--font-serif); line-height:1.72; color:#463d32; white-space:pre-wrap}
.story textarea{
  width:100%; min-height:96px; resize:vertical; padding:9px 10px;
  font-family:var(--font-serif); font-size:var(--text-body); line-height:1.7; color:var(--color-ink);
  background:var(--color-card); border:var(--rule) solid var(--color-line); border-radius:var(--radius-md);
}
.story textarea:focus{outline:none; border-color:var(--color-accent)}
.story-save{
  margin-top:10px; float:right; padding:7px 16px; border-radius:var(--radius-pill);
  border:var(--rule) solid var(--color-accent); background:var(--color-accent); color:var(--color-card);
  font-size:13px; cursor:pointer;
}
.story-save:hover{background:var(--color-accent-soft); border-color:var(--color-accent-soft)}
.story-orig{margin-top:14px; padding-top:12px; border-top:1px dashed var(--color-popup-line); clear:both}
.story-orig p{margin:0 0 7px; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--color-ink-soft)}
.story-orig img{
  display:block; width:100%; height:104px; object-fit:contain;
  background:rgba(239,230,212,.55); border:var(--rule) solid var(--color-line);
  border-radius:var(--radius-md); padding:8px;
}

/* 拖出 dock 的跟手幽灵 */
#ghost{position:fixed; left:0; top:0; z-index:60; width:92px; opacity:.9; pointer-events:none; filter:var(--shadow-item); display:none}

/* ============ 窄屏（横屏手机） ============ */
@media (max-width:880px){
  .brand{left:10px; top:10px; padding:7px 12px 6px}
  .brand h1{font-size:15px}
  .ctl{right:10px; top:10px}
  .scenes{bottom:10px}
  .dock{left:10px}
  .dock-panel{width:92px}
  .hint{display:none}
  .story{right:10px; left:10px; width:auto; top:auto; bottom:10px; transform:none; max-height:70vh}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.001ms !important}
}
</style>
</head>
<body data-mode="edit">
<div id="stage">
  <div class="scene-blur" id="blur"></div>
  <img class="scene-img" id="sceneImg" alt="">
  <div id="items"></div>

  <!-- 浮动小工具条（选中物件时出现） -->
  <div id="toolbar">
    <button id="tb-story" title="写它的故事">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </button>
    <div class="tb-div"></div>
    <button id="tb-del" title="移除">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
    </button>
  </div>

  <!-- 浮层外壳 -->
  <header class="chrome glass brand">
    <h1>念念 · 陈列室</h1>
    <small>Memory Gallery</small>
  </header>

  <div class="chrome ctl eye-keeper">
    <div class="seg glass" id="seg">
      <button class="on" data-m="edit">编辑</button>
      <button data-m="guest">游客</button>
    </div>
    <button class="eye glass" id="eye" title="隐藏界面，纯看房间">
      <svg id="eye-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>

  <nav class="chrome glass scenes" id="scenes"><span class="lbl">场景</span></nav>

  <aside class="chrome glass dock" id="dock">
    <div class="dock-panel">
      <div class="dock-head">物件库</div>
      <div class="dock-list" id="dock-list"></div>
    </div>
    <button class="dock-tab" id="dock-tab" title="收起 / 展开物件库">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </aside>

  <div class="chrome glass hint" id="hint"></div>

  <!-- 故事弹窗 -->
  <div class="story" id="story" hidden>
    <button class="story-close" id="story-close">✕</button>
    <div class="story-kicker">它的故事</div>
    <h2 class="story-name" id="story-name"></h2>
    <p class="story-meta" id="story-meta"></p>
    <p class="story-body" id="story-body"></p>
    <div id="story-editwrap" hidden>
      <textarea id="story-input" placeholder="写下它的来历、它陪你走过的日子……"></textarea>
      <button class="story-save" id="story-save">保存</button>
    </div>
    <div class="story-orig">
      <p>原始照片</p>
      <img id="story-photo" alt="">
    </div>
  </div>

  <img id="ghost" alt="">
</div>

<script>

    {it:'clock', x:-30, y:42, w:12, r:-6},        /* 故意摆进左侧补边区 */
    {it:'radio', x:122, y:58, w:13, r:0},         /* 右侧补边区 */

/* ================= 状态 ================= */
let cur = 0, mode = 'edit', sel = null, uiHidden = false;

const $ = (id)=>document.getElementById(id);
const stage=$('stage'), itemsEl=$('items'), blurEl=$('blur'), imgEl=$('sceneImg'),
      toolbar=$('toolbar'), story=$('story'), ghost=$('ghost'), hint=$('hint');

/* ============ 场景自适应层：contain 几何 ============ */
function rect(){
  const W=innerWidth, H=innerHeight, a=SCENES[cur].aspect;
  const iw=Math.min(W, H*a), ih=iw/a;
  return {ox:(W-iw)/2, oy:(H-ih)/2, iw, ih};
}
function toClient(p){ const r=rect(); return {x:r.ox+p.x/100*r.iw, y:r.oy+p.y/100*r.ih, w:p.w/100*r.iw}; }
function place(el,p){
  const c=toClient(p), h=c.w/ITEMS[p.it].ar;
  el.style.left=(c.x-c.w/2)+'px'; el.style.top=(c.y-h/2)+'px';
  el.style.width=c.w+'px'; el.style.transform='rotate('+p.r+'deg)';
}
function placeToolbar(){
  if(!sel || mode!=='edit'){ toolbar.classList.remove('show'); return; }
  const c=toClient(sel), h=c.w/ITEMS[sel.it].ar;
  toolbar.style.left=c.x+'px'; toolbar.style.top=(c.y-h/2-14)+'px';
  toolbar.classList.add('show');
}
function layoutScene(){
  const r=rect();
  imgEl.style.left=r.ox+'px'; imgEl.style.top=r.oy+'px';
  imgEl.style.width=r.iw+'px'; imgEl.style.height=r.ih+'px';
  itemsEl.querySelectorAll('.item').forEach(el=>place(el, el._p));
  placeToolbar();
}

/* ============ 渲染 ============ */
function renderScene(){
  const sc=SCENES[cur];
  imgEl.src=IMG[sc.key]; blurEl.style.backgroundImage='url('+IMG[sc.key]+')';
  itemsEl.innerHTML='';
  sc.pls.forEach(p=>{
    const el=document.createElement('div');
    el.className='item'; el._p=p;
    el.innerHTML='<img src="'+IMG[p.it]+'" alt="'+ITEMS[p.it].name+'">'+
      '<div class="sel-ui frame"></div>'+
      '<div class="sel-ui h tl"></div><div class="sel-ui h tr"></div>'+
      '<div class="sel-ui h bl"></div><div class="sel-ui h br"></div>'+
      '<button class="sel-ui rot" title="旋转"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>';
    bindItem(el,p);
    itemsEl.appendChild(el);
  });
  select(null);
  layoutScene();
  renderChips();
  hint.innerHTML = mode==='edit'
    ? '<b>拖一拖物件</b>——界面会自动让路 · 手柄缩放旋转 · 左侧物件库可拖出新物件'
    : '游客视角 · <b>点一件物件</b>，读它的故事';
}
function renderChips(){
  const nav=$('scenes');
  nav.querySelectorAll('.chip').forEach(c=>c.remove());
  SCENES.forEach((sc,i)=>{
    const b=document.createElement('button');
    b.className='chip'+(i===cur?' on':''); b.textContent=sc.name;
    b.onclick=()=>{ cur=i; renderScene(); };
    nav.appendChild(b);
  });
  const add=document.createElement('button');
  add.className='chip add'; add.textContent='＋ 新场景'; add.title='素材已用完（背景不可重复，上限 3）';
  nav.appendChild(add);
}
function select(p){
  sel=p;
  itemsEl.querySelectorAll('.item').forEach(el=>el.classList.toggle('is-sel', el._p===sel && mode==='edit'));
  placeToolbar();
}

/* ============ 手势：拖动（浮层让路）/ 缩放 / 旋转 ============ */
function bindItem(el,p){
  el.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    if(mode==='guest'){ openStory(p); return; }
    closeStory();
    el.setPointerCapture(e.pointerId);
    const r=rect(), sx=e.clientX, sy=e.clientY, bx=p.x, by=p.y;
    let moved=false;
    const mv=ev=>{
      const dx=ev.clientX-sx, dy=ev.clientY-sy;
      if(!moved){ if(Math.hypot(dx,dy)<4) return;
        moved=true; select(p); document.body.classList.add('dragging'); }
      p.x=bx+dx/r.iw*100; p.y=by+dy/r.ih*100; place(el,p);
    };
    const up=()=>{
      el.removeEventListener('pointermove',mv);
      document.body.classList.remove('dragging');
      if(!moved) select(p); else { select(p); }
    };
    el.addEventListener('pointermove',mv);
    el.addEventListener('pointerup',up,{once:true});
    el.addEventListener('pointercancel',up,{once:true});
  });
  /* 角手柄：等比缩放 */
  el.querySelectorAll('.h').forEach(hd=>{
    hd.addEventListener('pointerdown',e=>{
      e.stopPropagation();
      hd.setPointerCapture(e.pointerId);
      const c=toClient(p), bw=p.w,
            d0=Math.hypot(e.clientX-c.x, e.clientY-c.y)||1;
      document.body.classList.add('gesturing');
      const mv=ev=>{
        const d=Math.hypot(ev.clientX-c.x, ev.clientY-c.y);
        p.w=Math.min(70,Math.max(3,bw*d/d0)); place(el,p);
      };
      const up=()=>{ hd.removeEventListener('pointermove',mv);
        document.body.classList.remove('gesturing'); placeToolbar(); };
      hd.addEventListener('pointermove',mv);
      hd.addEventListener('pointerup',up,{once:true});
      hd.addEventListener('pointercancel',up,{once:true});
    });
  });
  /* 旋转钮 */
  const rb=el.querySelector('.rot');
  rb.addEventListener('pointerdown',e=>{
    e.stopPropagation();
    rb.setPointerCapture(e.pointerId);
    const c=toClient(p), br=p.r,
          a0=Math.atan2(e.clientY-c.y, e.clientX-c.x);
    document.body.classList.add('gesturing');
    const mv=ev=>{
      const a=Math.atan2(ev.clientY-c.y, ev.clientX-c.x);
      p.r=br+(a-a0)*180/Math.PI; place(el,p);
    };
    const up=()=>{ rb.removeEventListener('pointermove',mv);
      document.body.classList.remove('gesturing'); placeToolbar(); };
    rb.addEventListener('pointermove',mv);
    rb.addEventListener('pointerup',up,{once:true});
    rb.addEventListener('pointercancel',up,{once:true});
  });
}

/* ============ 工具条：故事 / 移除 ============ */
$('tb-story').onclick=e=>{ e.stopPropagation(); if(sel) openStory(sel); };
$('tb-del').onclick=e=>{
  e.stopPropagation();
  if(!sel) return;
  const pls=SCENES[cur].pls, i=pls.indexOf(sel);
  if(i>-1) pls.splice(i,1);
  renderScene();
};
toolbar.addEventListener('pointerdown',e=>e.stopPropagation());

/* ============ 物件库 dock：可收合 + 拖出新物件 ============ */
const dock=$('dock'), dockList=$('dock-list');
$('dock-tab').onclick=()=>dock.classList.toggle('closed');
Object.keys(ITEMS).forEach(key=>{
  const t=document.createElement('div');
  t.className='thumb';
  t.innerHTML='<img src="'+IMG[key]+'" alt=""><span>'+ITEMS[key].name+'</span>';
  t.addEventListener('pointerdown',e=>{
    if(mode!=='edit') return;
    e.preventDefault();
    t.setPointerCapture(e.pointerId);
    let dragging=false;
    const sx=e.clientX, sy=e.clientY;
    const mv=ev=>{
      if(!dragging){ if(Math.hypot(ev.clientX-sx,ev.clientY-sy)<6) return;
        dragging=true; document.body.classList.add('dragging');
        ghost.src=IMG[key]; ghost.style.display='block'; }
      ghost.style.transform='translate('+(ev.clientX-46)+'px,'+(ev.clientY-40)+'px)';
    };
    const up=ev=>{
      t.removeEventListener('pointermove',mv);
      ghost.style.display='none';
      document.body.classList.remove('dragging');
      if(!dragging) return;
      const r=rect();
      const p={it:key, x:(ev.clientX-r.ox)/r.iw*100, y:(ev.clientY-r.oy)/r.ih*100, w:13, r:0};
      SCENES[cur].pls.push(p);
      renderScene();
      const els=itemsEl.querySelectorAll('.item');
      select(els[els.length-1]._p);
    };
    t.addEventListener('pointermove',mv);
    t.addEventListener('pointerup',up,{once:true});
    t.addEventListener('pointercancel',up,{once:true});
  });
  dockList.appendChild(t);
});

/* ============ 模式切换 / 隐藏界面 ============ */
$('seg').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
    mode=b.dataset.m;
    document.body.dataset.mode=mode;
    $('seg').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    dock.style.display = mode==='edit' ? '' : 'none';
    closeStory(); renderScene();
  };
});
$('eye').onclick=()=>{
  uiHidden=!uiHidden;
  document.body.classList.toggle('ui-hidden', uiHidden);
};

/* ============ 故事弹窗 ============ */
let storyOf=null;
function openStory(p){
  storyOf=p;
  const it=ITEMS[p.it];
  $('story-name').textContent=it.name;
  $('story-meta').textContent='陈列于 · '+SCENES[cur].name;
  $('story-photo').src=IMG[p.it];
  if(mode==='edit'){
    $('story-body').hidden=true;
    $('story-editwrap').hidden=false;
    $('story-input').value=it.story;
  }else{
    $('story-body').hidden=false;
    $('story-body').textContent=it.story;
    $('story-editwrap').hidden=true;
  }
  story.hidden=false;
}
function closeStory(){ story.hidden=true; storyOf=null; }
$('story-close').onclick=closeStory;
$('story-save').onclick=()=>{ if(storyOf) ITEMS[storyOf.it].story=$('story-input').value; closeStory(); };
story.addEventListener('pointerdown',e=>e.stopPropagation());

/* 点空白：清选中 + 关弹窗 */
stage.addEventListener('pointerdown',()=>{ select(null); closeStory(); });

/* ============ 启动 ============ */
if(innerWidth<880) dock.classList.add('closed');
addEventListener('resize',layoutScene);
renderScene();
</script>
</body>
</html>
