/* Hallmark · macrostructure: Workbench · genre: editorial · theme: Almanac warm-cream · accent terracotta · high-contrast serif */
:root{--paper:#f4ecdd;--card:#fbf6ec;--ink:#2c2620;--ink-soft:#6b6152;--line:#d9cdb6;--accent:#a8572f;
 --serif:Georgia,"Songti SC","Times New Roman",serif;--sans:system-ui,-apple-system,"PingFang SC","Helvetica Neue",sans-serif;--r:6px}
html,body{background:#e7dcc7;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:clip}
body{padding:22px;display:flex;justify-content:center}
.app{width:100%;max-width:1180px;background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px -20px rgba(60,40,20,.35);overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;padding:15px 22px;border-bottom:1px solid var(--line);background:linear-gradient(#faf4e8,#f4ecdd)}
.brand{font-family:var(--serif);font-size:20px;letter-spacing:.5px}
.brand small{display:block;font-family:var(--sans);font-size:10.5px;letter-spacing:3px;color:var(--ink-soft);text-transform:uppercase;margin-top:2px}
.seg{display:flex;border:1px solid var(--accent);border-radius:999px;overflow:hidden;font-size:13px}
.seg button{border:0;background:transparent;color:var(--accent);padding:6px 16px;cursor:pointer;font-family:var(--sans)}
.seg button.on{background:var(--accent);color:#fbf6ec}
.scenes{display:flex;gap:10px;align-items:center;padding:11px 22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.scenes .lbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft)}
.chip{font-family:var(--serif);font-size:14px;padding:5px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink-soft)}
.chip.on{border-color:var(--accent);color:var(--accent);background:#fbeee2}
.chip.add{border-style:dashed;color:#b9ad97;position:relative}
.chip.add::after{content:"素材已用完";position:absolute;top:-26px;left:50%;transform:translateX(-50%);white-space:nowrap;font-family:var(--sans);font-size:10px;background:var(--ink);color:#f4ecdd;padding:3px 7px;border-radius:4px;opacity:.92}
.grid{display:grid;grid-template-columns:120px 1fr;min-height:520px}
.tray{border-right:1px solid var(--line);padding:16px 12px;background:#f7efe0}
.tray h4{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--ink-soft);margin-bottom:4px}
.tray .hint{font-size:11px;color:#b0a487;margin-bottom:14px}
.thumb{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:8px;margin-bottom:12px;text-align:center;cursor:grab;transition:transform .18s,box-shadow .18s}
.thumb:hover{transform:translateY(-2px);box-shadow:0 6px 16px -8px rgba(60,40,20,.4)}
.thumb .itm{height:56px}
.thumb span{display:block;font-family:var(--serif);font-size:12px;margin-top:5px;color:var(--ink-soft)}
.stage{position:relative;overflow:hidden;background:#000}
.stage .bg{position:absolute;inset:0}
.stage::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 90px rgba(40,25,10,.35);pointer-events:none}
.node{position:absolute;transform-origin:center;filter:drop-shadow(0 10px 14px rgba(0,0,0,.45))}
.sel{position:absolute;transform-origin:center}
.sel .art{position:absolute;inset:0;filter:drop-shadow(0 12px 16px rgba(0,0,0,.45))}
.sel .frame{position:absolute;inset:-7px;border:1.5px solid var(--accent);border-radius:3px}
.sel .h{position:absolute;width:12px;height:12px;background:#fbf6ec;border:1.6px solid var(--accent);border-radius:2px}
.sel .tl{left:-7px;top:-7px}.sel .tr{right:-7px;top:-7px}.sel .bl{left:-7px;bottom:-7px}.sel .br{right:-7px;bottom:-7px}
.sel .stem{position:absolute;left:50%;top:-34px;width:1.6px;height:27px;background:var(--accent);transform:translateX(-50%)}
.sel .rot{position:absolute;left:50%;top:-44px;width:15px;height:15px;border-radius:50%;background:#fbf6ec;border:1.6px solid var(--accent);color:var(--accent);font-size:10px;display:flex;align-items:center;justify-content:center;transform:translateX(-50%)}
.sel .tag{position:absolute;left:50%;bottom:-30px;transform:translateX(-50%);white-space:nowrap;font-family:var(--serif);font-size:12px;background:var(--ink);color:#f4ecdd;padding:3px 10px;border-radius:999px}
.sel .del{position:absolute;right:-9px;top:-46px;width:22px;height:22px;border-radius:50%;background:var(--ink);color:#f4ecdd;border:0;font-size:11px;cursor:pointer}
.popup{position:absolute;right:26px;top:50%;transform:translateY(-50%);width:290px;z-index:9;
 background:linear-gradient(155deg,rgba(251,246,236,.9),rgba(245,236,221,.85));backdrop-filter:blur(9px) saturate(1.06);-webkit-backdrop-filter:blur(9px) saturate(1.06);
 border:1px solid rgba(168,87,47,.42);border-radius:10px;padding:22px 20px 20px;box-shadow:0 22px 48px -16px rgba(60,40,20,.6)}
.popup .x{position:absolute;right:11px;top:11px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.4);border:1px solid var(--line);color:var(--ink-soft);font-size:11px;cursor:pointer;line-height:1}
.popup .k{font-size:10.5px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
